<!-- Universal WhatsApp Consensus Sharing Modal Primitive (STD-MOD-COMP-001) -->
<div class="sk-modal-backdrop" id="skWhatsAppShareBackdrop" role="dialog" aria-modal="true" aria-labelledby="skWhatsAppModalTitle">
  <div class="sk-modal-card sk-share-modal-card">
    <div class="sk-share-modal-header">
      <div class="sk-share-icon-badge">💬</div>
      <div>
        <h3 id="skWhatsAppModalTitle" class="sk-share-modal-title">Share for Consensus</h3>
        <p class="sk-share-modal-sub">Generate direct 1-tap review link for family & stakeholders</p>
      </div>
      <button type="button" class="sk-modal-close" id="skWhatsAppModalClose" aria-label="Close modal">✕</button>
    </div>
    <div class="sk-share-modal-body">
      <div class="sk-share-preview-box" id="skSharePreviewText">
        <!-- Formatted message preview -->
      </div>
      <div class="sk-share-actions">
        <button type="button" class="sk-btn sk-btn-primary" id="skBtnCopyShare">📋 Copy Message</button>
        <a href="#" target="_blank" rel="noopener noreferrer" class="sk-btn sk-btn-whatsapp" id="skBtnOpenWhatsApp">🚀 Open in WhatsApp</a>
      </div>
    </div>
  </div>
</div>
