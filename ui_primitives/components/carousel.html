<!-- Universal Visual Snap Carousel Primitive (STD-MOD-COMP-001) -->
<div class="sk-carousel-shell" id="skCarouselShell">
  <div class="sk-carousel-track" id="skCarouselTrack">
    <!-- Slides dynamically injected or templated -->
  </div>
  <div class="sk-carousel-controls">
    <button type="button" class="sk-carousel-btn" id="skCarouselPrev" aria-label="Previous Slide">‹</button>
    <button type="button" class="sk-carousel-btn" id="skCarouselNext" aria-label="Next Slide">›</button>
  </div>
</div>
