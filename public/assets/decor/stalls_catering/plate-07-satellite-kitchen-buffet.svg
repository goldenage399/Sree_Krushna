  <rect x="100" y="250" width="280" height="50" fill="#18181b" stroke="#eab308" stroke-width="2" rx="4"/>
  <text x="240" y="280" fill="#fde047" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BUFFET RUN A (24FT) — ROTI, DAL &amp; MAINS</text>
  <!-- Chafing Dishes -->
