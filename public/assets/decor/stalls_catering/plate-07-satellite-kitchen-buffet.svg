<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="kitchenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#kitchenBg)" rx="8"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>

  <text x="40" y="55" fill="#fb923c" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" letter-spacing="1">CATERING OPERATIONS SCHEMATIC — PLATE 07</text>
  <text x="40" y="75" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">BOH SATELLITE FINISHING KITCHEN (FIRE SAFED) &amp; DUAL 24FT LINEAR BUFFET RUNS | ZONE C</text>

  <!-- Acoustic & Visual Camouflage Screening Wall -->
  <line x1="80" y1="210" x2="720" y2="210" stroke="#f97316" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="400" y="200" fill="#fb923c" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">FIRE-RETARDANT PRINTED BACKDROP SCREENING WALL (GUEST VIEW MASKING)</text>

  <!-- TOP HALF: BACK OF HOUSE (BOH) SATELLITE KITCHEN -->
  <rect x="80" y="90" width="640" height="100" fill="#27272a" stroke="#52525b" stroke-width="1" rx="4"/>
  <text x="95" y="112" fill="#ea580c" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">BOH SERVICE PASS &amp; FINISHING HUBS</text>

