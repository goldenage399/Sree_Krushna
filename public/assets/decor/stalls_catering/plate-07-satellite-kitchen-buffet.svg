  <rect x="580" y="120" width="110" height="45" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" rx="3"/>
  <text x="635" y="145" fill="#93c5fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2,000L WATER BOWSER</text>

