  <rect x="140" y="340" width="180" height="45" fill="#3f3f46" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="230" y="367" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIVE CHAAT &amp; DOSA</text>

  <rect x="480" y="340" width="180" height="45" fill="#3f3f46" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="570" y="367" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIVE JALEBI &amp; ICE CREAM</text>

  <rect x="40" y="440" width="720" height="28" fill="#3f3f46" stroke="#f59e0b" stroke-width="1" rx="4"/>
  <text x="400" y="458" fill="#fef08a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TURNKEY OPERATIONAL STANDARD: SATELLITE KITCHEN FULLY CAMOUFLAGED | ZERO SMOKE INTO SANCTUARY</text>
