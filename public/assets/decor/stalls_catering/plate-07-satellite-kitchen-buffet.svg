  <circle cx="290" cy="275" r="10" fill="#ca8a04"/>
  <circle cx="340" cy="275" r="10" fill="#ca8a04"/>

  <!-- Buffet Run 2 -->
  <rect x="420" y="250" width="280" height="50" fill="#18181b" stroke="#eab308" stroke-width="2" rx="4"/>
  <text x="560" y="280" fill="#fde047" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BUFFET RUN B (24FT) — BIRYANI, RICE &amp; DESSERTS</text>
  <circle cx="460" cy="275" r="10" fill="#ca8a04"/>
  <circle cx="510" cy="275" r="10" fill="#ca8a04"/>
  <circle cx="610" cy="275" r="10" fill="#ca8a04"/>
  <circle cx="660" cy="275" r="10" fill="#ca8a04"/>

