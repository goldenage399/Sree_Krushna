<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mehendiLawn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="umbrellaPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="umbrellaYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#mehendiLawn)" rx="8"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>

  <text x="40" y="55" fill="#fde047" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" letter-spacing="1">GARDEN PROMENADE SCHEMATIC — PLATE 06</text>
  <text x="40" y="75" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">MEHENDI PHASE 2 (14:30–17:00) OPEN-AIR LAWN LOUNGE, RAJASTHANI PARASOLS &amp; LIVE STALLS | ZONE D</text>

  <!-- Lawn Ground Plane -->
  <rect x="60" y="220" width="680" height="200" fill="#047857" fill-opacity="0.3" rx="6"/>

  <!-- Rajasthani Parasol 1 (Pink) -->
  <path d="M 120 220 Q 200 130 280 220 Z" fill="url(#umbrellaPink)" stroke="#be123c" stroke-width="2"/>
  <line x1="200" y1="220" x2="200" y2="350" stroke="#ffd166" stroke-width="5"/>
  <!-- Hanging tassels -->
  <line x1="130" y1="220" x2="130" y2="235" stroke="#fbbf24" stroke-width="2"/>
  <line x1="170" y1="220" x2="170" y2="235" stroke="#fbbf24" stroke-width="2"/>
  <line x1="230" y1="220" x2="230" y2="235" stroke="#fbbf24" stroke-width="2"/>
  <line x1="270" y1="220" x2="270" y2="235" stroke="#fbbf24" stroke-width="2"/>

  <!-- Low Charpai / Diwan Seating Under Umbrella 1 -->
  <rect x="140" y="340" width="120" height="24" fill="#d97706" stroke="#b45309" stroke-width="2" rx="4"/>
  <!-- Silk Bolster Pillows -->
  <rect x="150" y="328" width="30" height="12" fill="#ec4899" rx="4"/>
  <rect x="220" y="328" width="30" height="12" fill="#8b5cf6" rx="4"/>
  <text x="200" y="380" fill="#fde68a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LOW DIWAN SEATING</text>

  <!-- Rajasthani Parasol 2 (Yellow) -->
  <path d="M 520 220 Q 600 130 680 220 Z" fill="url(#umbrellaYellow)" stroke="#b45309" stroke-width="2"/>
  <line x1="600" y1="220" x2="600" y2="350" stroke="#ffd166" stroke-width="5"/>
  <rect x="540" y="340" width="120" height="24" fill="#d97706" stroke="#b45309" stroke-width="2" rx="4"/>
  <rect x="550" y="328" width="30" height="12" fill="#10b981" rx="4"/>
  <rect x="620" y="328" width="30" height="12" fill="#f43f5e" rx="4"/>
  <text x="600" y="380" fill="#fde68a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LOW DIWAN SEATING</text>

  <!-- Center Brass Urli with Floating Flowers -->
  <ellipse cx="400" cy="345" rx="55" ry="18" fill="#eab308" stroke="#ca8a04" stroke-width="3"/>
  <ellipse cx="400" cy="345" rx="48" ry="14" fill="#1e3a8a"/>
  <!-- Floating Marigolds -->
  <circle cx="380" cy="343" r="6" fill="#f97316"/>
  <circle cx="415" cy="342" r="5" fill="#facc15"/>
  <circle cx="395" cy="348" r="6" fill="#fb923c"/>
  <text x="400" y="380" fill="#fef08a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">BRASS URLI (FLOATING MARIGOLDS)</text>

  <!-- Background Stall Pavilions -->
  <rect x="320" y="160" width="160" height="70" fill="#065f46" stroke="#34d399" stroke-width="1.5" rx="4"/>
  <text x="400" y="185" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HIGH-TEA &amp; CHAAT STALL</text>
  <text x="400" y="205" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">Live Jalebi &amp; Masala Chai</text>

  <!-- Decision Alignment Callout -->
  <rect x="40" y="440" width="720" height="28" fill="#064e3b" stroke="#10b981" stroke-width="1.2" rx="4"/>
  <text x="400" y="458" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AC-DEC-2026-007 ALIGNED: UNLOCKS 7.5H SANGEET TECH WINDOW IN ZONE A WHILE GUESTS ENJOY ZONE D</text>
</svg>