<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="stallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#stallBg)" rx="8"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#4338ca" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>

  <text x="40" y="55" fill="#c084fc" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" letter-spacing="1">GUEST ENGAGEMENT HUBS — PLATE 08</text>
  <text x="40" y="75" fill="#e0e7ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">INTERACTIVE WOODEN PERGOLA BOOTHS: BANGLE MAKER, POLAROID PHOTO-OP &amp; WELCOME GONG</text>

  <!-- Stall 1: Lac Bangle Maker -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="200" height="230" fill="#1e1b4b" stroke="#e879f9" stroke-width="2" rx="6"/>
    <!-- Awning Canopy -->
    <path d="M 0 40 Q 100 10 200 40 L 200 0 L 0 0 Z" fill="#d946ef"/>
    <text x="100" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LAC BANGLE ARTISAN</text>
    <rect x="20" y="80" width="160" height="60" fill="#3b0764" stroke="#f472b6" stroke-width="1" rx="4"/>
    <text x="100" y="115" fill="#fbcfe8" font-family="monospace" font-size="10" text-anchor="middle">Live Heat Shaping</text>
    <!-- Bangle rings -->
    <circle cx="70" cy="175" r="14" fill="none" stroke="#f43f5e" stroke-width="4"/>
    <circle cx="100" cy="175" r="14" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="130" cy="175" r="14" fill="none" stroke="#10b981" stroke-width="4"/>
    <text x="100" y="215" fill="#e879f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CUSTOM SIZING FOR GUESTS</text>
  </g>

  <!-- Stall 2: Polaroid & Floral Photo-Op -->
  <g transform="translate(300, 130)">
    <rect x="0" y="0" width="200" height="230" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <path d="M 0 40 Q 100 10 200 40 L 200 0 L 0 0 Z" fill="#0284c7"/>
    <text x="100" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">POLAROID PHOTO BOOTH</text>
    <!-- Photo Frame -->
    <rect x="40" y="65" width="120" height="110" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="2"/>
    <rect x="50" y="75" width="100" height="75" fill="#0284c7" fill-opacity="0.2"/>
    <circle cx="100" cy="110" r="16" fill="#0284c7"/>
    <text x="100" y="165" fill="#64748b" font-family="'Cinzel', serif" font-size="9" text-anchor="middle">#SreeKrushna2026</text>
    <text x="100" y="215" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">INSTANT TAKE-HOME PRINTS</text>
  </g>

  <!-- Stall 3: Welcome Desk & Itinerary -->
  <g transform="translate(540, 130)">
    <rect x="0" y="0" width="200" height="230" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2" rx="6"/>
    <path d="M 0 40 Q 100 10 200 40 L 200 0 L 0 0 Z" fill="#d97706"/>
    <text x="100" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WELCOME CONCIERGE</text>
    <!-- Brass Gong -->
    <circle cx="100" cy="100" r="28" fill="#ffd166" stroke="#b45309" stroke-width="3"/>
    <circle cx="100" cy="100" r="8" fill="#b45309"/>
    <!-- Itinerary Scrolls -->
    <rect x="40" y="145" width="120" height="35" fill="#fef3c7" stroke="#d97706" stroke-width="1" rx="2"/>
    <text x="100" y="166" fill="#92400e" font-family="monospace" font-size="9" text-anchor="middle">Laminated Run Sheets</text>
    <text x="100" y="215" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">KEYCARDS &amp; GUEST LIAISON</text>
  </g>

  <!-- Bottom Guideline -->
  <rect x="40" y="440" width="720" height="28" fill="#312e81" stroke="#818cf8" stroke-width="1" rx="4"/>
  <text x="400" y="458" fill="#e0e7ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ALL ACTIVITY STALLS REUSABLE ACROSS DAY (HALDI/MEHENDI) &amp; NIGHT (SANGEET/WEDDING)</text>
</svg>