<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tunnelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081021"/>
      <stop offset="100%" stop-color="#17223b"/>
    </linearGradient>
    <linearGradient id="carpetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#tunnelBg)" rx="8"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#2a3b5c" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>

  <text x="40" y="55" fill="#f43f5e" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" letter-spacing="1">TRANSIT ARCHITECTURE — PLATE 05</text>
  <text x="40" y="75" fill="#a0aec0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">50M WEATHERPROOF COVERED GRAND CANOPY CORRIDOR (HOTEL PORCH TO MARQUEE ENTRANCE)</text>

  <!-- Perspective Tunnel Arch Framework -->
  <!-- Arch 1 (Front/Largest) -->
  <path d="M 120 420 Q 400 60 680 420" fill="none" stroke="#e11d48" stroke-width="4"/>
  <!-- Arch 2 -->
  <path d="M 180 410 Q 400 110 620 410" fill="none" stroke="#be123c" stroke-width="3" opacity="0.85"/>
  <!-- Arch 3 -->
  <path d="M 240 400 Q 400 160 560 400" fill="none" stroke="#9f1239" stroke-width="2.5" opacity="0.7"/>
  <!-- Arch 4 -->
  <path d="M 300 390 Q 400 210 500 390" fill="none" stroke="#881337" stroke-width="2" opacity="0.55"/>
  <!-- Arch 5 (Distant Vanishing Point) -->
  <path d="M 350 380 Q 400 260 450 380" fill="none" stroke="#4c0519" stroke-width="1.5" opacity="0.4"/>

  <!-- Connecting Longitudinal Purlins -->
  <line x1="400" y1="150" x2="400" y2="320" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="260" y1="290" x2="375" y2="350" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="540" y1="290" x2="425" y2="350" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Needle-Felt Red Carpet Runner -->
  <polygon points="180,420 620,420 450,380 350,380" fill="url(#carpetGrad)"/>
  <text x="400" y="412" fill="#fee2e2" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">8FT NEEDLE-FELT CRIMSON RUNNER CARPET</text>

  <!-- Fairy Light Canopy (Twinkling Yellow Points) -->
  <g fill="#fef08a">
    <circle cx="200" cy="360" r="2.5"/>
    <circle cx="230" cy="310" r="2.5"/>
    <circle cx="280" cy="240" r="2.5"/>
    <circle cx="340" cy="180" r="2.5"/>
    <circle cx="400" cy="155" r="3"/>
    <circle cx="460" cy="180" r="2.5"/>
    <circle cx="520" cy="240" r="2.5"/>
    <circle cx="570" cy="310" r="2.5"/>
    <circle cx="600" cy="360" r="2.5"/>
    <circle cx="260" cy="340" r="2"/>
    <circle cx="310" cy="270" r="2"/>
    <circle cx="360" cy="220" r="2"/>
    <circle cx="400" cy="205" r="2"/>
    <circle cx="440" cy="220" r="2"/>
    <circle cx="490" cy="270" r="2"/>
    <circle cx="540" cy="340" r="2"/>
  </g>

  <!-- Left: Hotel Porch Node -->
  <rect x="40" y="320" width="100" height="90" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="4"/>
  <text x="90" y="350" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HOTEL PORCH</text>
  <text x="90" y="370" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">ORIGIN</text>

  <!-- Right: Marquee Foyer Node -->
  <rect x="660" y="320" width="100" height="90" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" rx="4"/>
  <text x="710" y="350" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MARQUEE</text>
  <text x="710" y="370" fill="#fda4af" font-family="monospace" font-size="10" text-anchor="middle">SANCTUARY</text>

  <!-- Logistics Annotations -->
  <rect x="40" y="440" width="720" height="28" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" rx="4"/>
  <text x="400" y="458" fill="#c7d2fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ELECTRIC GOLF CART SHUTTLE FOR ELDERS (PER-012) | RAINPROOF HIGH-DENSITY TARPAULIN OVERHEAD</text>
</svg>