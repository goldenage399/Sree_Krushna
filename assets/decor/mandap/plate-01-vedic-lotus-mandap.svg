<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#e0a93b"/>
      <stop offset="100%" stop-color="#b3821a"/>
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#f4ecd8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="8"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#2a3b5c" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>

  <!-- Blueprint Header -->
  <text x="40" y="55" fill="#ffd166" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" font-weight="700" letter-spacing="1">ARCHITECTURAL SCHEMATIC — PLATE 01</text>
  <text x="40" y="75" fill="#a0aec0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">VEDIC LOTUS MANDAP ELEVATION &amp; 18" ELEVATED CEREMONIAL STAGE | ZONE A</text>

  <!-- Architectural Stage / Podium -->
  <!-- Base Ground Level -->
  <line x1="80" y1="430" x2="720" y2="430" stroke="#4a5568" stroke-width="2"/>
  <text x="730" y="434" fill="#718096" font-family="monospace" font-size="10">GL ±0.00</text>

  <!-- 18" Wooden Stage Step 1 -->
  <rect x="140" y="405" width="520" height="25" fill="#2d3748" stroke="#ffd166" stroke-width="1.5"/>
  <text x="400" y="422" fill="#cbd5e0" font-family="monospace" font-size="11" text-anchor="middle">TREATED TIMBER RISER — 18" HEIGHT (450mm)</text>

  <!-- 2mm Galvanized Zinc Fire Subfloor Plate -->
  <rect x="300" y="398" width="200" height="7" fill="#718096" stroke="#e2e8f0" stroke-width="1"/>
  <text x="510" y="404" fill="#ffd166" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">2mm ZINC FIRE BARRIER</text>

  <!-- Sacred Havan Kund Altar -->
  <polygon points="340,398 460,398 440,360 360,360" fill="#b3541e" stroke="#e0a93b" stroke-width="1.5"/>
  <polygon points="360,360 440,360 425,335 375,335" fill="#d97706" stroke="#ffd166" stroke-width="1.5"/>
  <!-- Sacred Flame Symbol -->
  <path d="M 400 290 Q 415 320 400 335 Q 385 320 400 290 Z" fill="#f59e0b" filter="url(#glow)"/>
  <path d="M 400 305 Q 408 322 400 335 Q 392 322 400 305 Z" fill="#fef08a"/>

  <!-- 4 Carved Pillars -->
  <!-- Pillar 1 (Left Outer) -->
  <rect x="180" y="150" width="36" height="255" fill="url(#goldGrad)" rx="3"/>
  <rect x="174" y="140" width="48" height="15" fill="#b3821a" rx="2"/>
  <rect x="174" y="395" width="48" height="12" fill="#b3821a" rx="2"/>
  <!-- Pillar 2 (Left Inner) -->
  <rect x="250" y="150" width="28" height="255" fill="url(#goldGrad)" opacity="0.85" rx="3"/>
  <!-- Pillar 3 (Right Inner) -->
  <rect x="522" y="150" width="28" height="255" fill="url(#goldGrad)" opacity="0.85" rx="3"/>
  <!-- Pillar 4 (Right Outer) -->
  <rect x="584" y="150" width="36" height="255" fill="url(#goldGrad)" rx="3"/>
  <rect x="578" y="140" width="48" height="15" fill="#b3821a" rx="2"/>
  <rect x="578" y="395" width="48" height="12" fill="#b3821a" rx="2"/>

  <!-- Overhanging Floral Roof Dome / Lotus Canopy -->
  <!-- Main Cross Beam -->
  <rect x="160" y="130" width="480" height="16" fill="url(#goldGrad)" rx="2"/>
  <!-- Floral Arch -->
  <path d="M 170 130 Q 400 60 630 130" fill="none" stroke="#e0a93b" stroke-width="4"/>
  <path d="M 180 130 Q 400 75 620 130" fill="url(#fabricGrad)" opacity="0.95"/>
  
  <!-- Lotus Petal Silhouette -->
  <path d="M 400 65 C 380 90 350 115 400 130 C 450 115 420 90 400 65 Z" fill="#ffd166"/>
  <path d="M 350 85 C 330 105 320 120 365 130 C 390 120 375 105 350 85 Z" fill="#e0a93b"/>
  <path d="M 450 85 C 470 105 480 120 435 130 C 410 120 425 105 450 85 Z" fill="#e0a93b"/>

  <!-- Hanging Marigold & Jasmine Garlands -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="1,6">
    <line x1="200" y1="146" x2="200" y2="230"/>
    <line x1="230" y1="146" x2="230" y2="270"/>
    <line x1="280" y1="146" x2="280" y2="210"/>
    <line x1="330" y1="146" x2="330" y2="190"/>
    <line x1="470" y1="146" x2="470" y2="190"/>
    <line x1="520" y1="146" x2="520" y2="210"/>
    <line x1="570" y1="146" x2="570" y2="270"/>
    <line x1="600" y1="146" x2="600" y2="230"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="1,5">
    <line x1="215" y1="146" x2="215" y2="250"/>
    <line x1="305" y1="146" x2="305" y2="200"/>
    <line x1="495" y1="146" x2="495" y2="200"/>
    <line x1="585" y1="146" x2="585" y2="250"/>
  </g>

  <!-- Brass Samai Lamps -->
  <g fill="url(#goldGrad)">
    <!-- Left Samai -->
    <rect x="130" y="320" width="8" height="85" rx="2"/>
    <ellipse cx="134" cy="320" rx="14" ry="4"/>
    <ellipse cx="134" cy="405" rx="16" ry="5"/>
    <circle cx="134" cy="312" r="3" fill="#fef08a" filter="url(#glow)"/>
    <!-- Right Samai -->
    <rect x="662" y="320" width="8" height="85" rx="2"/>
    <ellipse cx="666" cy="320" rx="14" ry="4"/>
    <ellipse cx="666" cy="405" rx="16" ry="5"/>
    <circle cx="666" cy="312" r="3" fill="#fef08a" filter="url(#glow)"/>
  </g>

  <!-- Technical Dimension Annotations -->
  <line x1="140" y1="445" x2="660" y2="445" stroke="#a0aec0" stroke-width="1"/>
  <line x1="140" y1="440" x2="140" y2="450" stroke="#a0aec0" stroke-width="1"/>
  <line x1="660" y1="440" x2="660" y2="450" stroke="#a0aec0" stroke-width="1"/>
  <text x="400" y="460" fill="#a0aec0" font-family="monospace" font-size="11" text-anchor="middle">CLEAR STAGE WIDTH: 24'-0" (7.32m)</text>

  <!-- Verification Badge -->
  <rect x="570" y="45" width="185" height="28" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" rx="4"/>
  <text x="662" y="64" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ BINDING SPECIFICATION</text>
</svg>