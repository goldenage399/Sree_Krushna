<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a122a"/>
      <stop offset="100%" stop-color="#1b284f"/>
    </linearGradient>
    <linearGradient id="roofFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#eedfc5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyGrad)" rx="8"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#2a3b5c" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>

  <text x="40" y="55" fill="#fde047" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" letter-spacing="1">MODULAR BASE INFRASTRUCTURE — PLATE 04</text>
  <text x="40" y="75" fill="#a0aec0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">120FT × 80FT GERMAN ALUMINUM HANGAR &amp; THERMAL PARTITIONING (AC SANCTUARY VS COOLER DINING)</text>

  <!-- Hangar Profile Truss Outline -->
  <!-- Left Wall Column (14ft) -->
  <line x1="80" y1="410" x2="80" y2="230" stroke="#cbd5e0" stroke-width="4"/>
  <!-- Right Wall Column (14ft) -->
  <line x1="720" y1="410" x2="720" y2="230" stroke="#cbd5e0" stroke-width="4"/>
  <!-- Roof Slopes to Ridge Apex (24ft height) -->
  <line x1="80" y1="230" x2="400" y2="130" stroke="#cbd5e0" stroke-width="5"/>
  <line x1="720" y1="230" x2="400" y2="130" stroke="#cbd5e0" stroke-width="5"/>
  <line x1="80" y1="230" x2="720" y2="230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Pleated Fabric Lining Texture (Ivory Satin) -->
  <path d="M 85 230 L 400 135 L 715 230" fill="url(#roofFabric)" opacity="0.9"/>
  <!-- Drapes Pleat Lines -->
  <g stroke="#d4c3a3" stroke-width="1.5" opacity="0.6">
    <line x1="120" y1="230" x2="400" y2="135"/>
    <line x1="180" y1="230" x2="400" y2="135"/>
    <line x1="250" y1="230" x2="400" y2="135"/>
    <line x1="320" y1="230" x2="400" y2="135"/>
    <line x1="480" y1="230" x2="400" y2="135"/>
    <line x1="550" y1="230" x2="400" y2="135"/>
    <line x1="620" y1="230" x2="400" y2="135"/>
    <line x1="680" y1="230" x2="400" y2="135"/>
  </g>

  <!-- Central Thermal & Acoustic Partition Wall -->
  <rect x="396" y="230" width="8" height="180" fill="#e2e8f0" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="320" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90 390 320)">ACOUSTIC &amp; THERMAL PARTITION</text>

  <!-- ZONE A & B: AIR CONDITIONED SANCTUARY (LEFT) -->
  <rect x="85" y="235" width="308" height="175" fill="#1e3a8a" fill-opacity="0.15"/>
  <rect x="95" y="245" width="165" height="24" fill="#1d4ed8" rx="4"/>
  <text x="177" y="261" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ZONE A &amp; B: 40T AC SANCTUARY</text>
  <text x="100" y="290" fill="#93c5fd" font-family="monospace" font-size="11">• Sealed 40T Package HVAC</text>
  <text x="100" y="310" fill="#93c5fd" font-family="monospace" font-size="11">• 24°C Maintained Ambient</text>
  <text x="100" y="330" fill="#93c5fd" font-family="monospace" font-size="11">• Mandap &amp; Guest Viewing Chairs</text>
  <text x="100" y="350" fill="#93c5fd" font-family="monospace" font-size="11">• Crystal Chandelier Cluster</text>

  <!-- AC Duct Diffusers -->
  <rect x="90" y="218" width="80" height="10" fill="#38bdf8" rx="2"/>
  <g fill="#38bdf8">
    <polygon points="110,232 105,225 115,225"/>
    <polygon points="140,232 135,225 145,225"/>
  </g>

  <!-- ZONE C: VENTILATED DINING & BUFFET (RIGHT) -->
  <rect x="406" y="235" width="308" height="175" fill="#065f46" fill-opacity="0.15"/>
  <rect x="416" y="245" width="175" height="24" fill="#047857" rx="4"/>
  <text x="503" y="261" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ZONE C: DINING &amp; BUFFET</text>
  <text x="420" y="290" fill="#a7f3d0" font-family="monospace" font-size="11">• Heavy-Duty Desert Misting Coolers</text>
  <text x="420" y="310" fill="#a7f3d0" font-family="monospace" font-size="11">• Natural Cross-Draft Exhaust</text>
  <text x="420" y="330" fill="#a7f3d0" font-family="monospace" font-size="11">• 40 Round Dining Tables (8-seat)</text>
  <text x="420" y="350" fill="#a7f3d0" font-family="monospace" font-size="11">• High-Throughput Buffet Lines</text>

  <!-- Desert Coolers Representation -->
  <rect x="700" y="320" width="18" height="50" fill="#10b981" stroke="#ffffff" stroke-width="1" rx="2"/>
  <text x="690" y="350" fill="#10b981" font-family="monospace" font-size="9" text-anchor="end">COOLER</text>

  <!-- Ground Floor Plinth -->
  <rect x="70" y="410" width="660" height="20" fill="#334155" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="400" y="425" fill="#f8fafc" font-family="monospace" font-size="11" text-anchor="middle">COMPACTED SUB-BASE + TIMBER UNDER-FLOORING + CARPET FINISH</text>

  <!-- Dimensions Indicator -->
  <text x="400" y="455" fill="#ffd166" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TOTAL CAPACITY: 500 GUESTS | FOOTPRINT: 9,600 SQ. FT. (120' × 80')</text>
</svg>